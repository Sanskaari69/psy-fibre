name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Claims gate — banned words must be zero
        run: |
          fail=0
          for w in powder sachet mix stir shaker dissolve; do
            n=$(grep -oi "$w" index.html | wc -l)
            echo "$w: $n"; [ "$n" -eq 0 ] || fail=1
          done
          exit $fail
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
